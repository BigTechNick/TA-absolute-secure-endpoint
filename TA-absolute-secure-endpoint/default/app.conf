description = Collects Absolute Secure Endpoint SIEM events (device, console and alert activity) and device inventory from the Absolute API, with CIM mappings (Authentication, Change, Alerts, Data Access, Inventory). Accounts, inputs and status are managed in Splunk Web. Not affiliated with Absolute Software.
