# TA-absolute-secure-endpoint
[install]
build = 2

[launcher]
author = Nikhil Chawla
description = Collects Absolute Secure Endpoint SIEM events (device, console and alert activity) and device inventory from the Absolute API, with CIM mappings (Authentication, Change, Alerts, Data Access, Inventory). Accounts, inputs and status are managed in Splunk Web. Not affiliated with Absolute Software.
version = 1.0.2

[ui]
is_visible = true
label = Absolute Secure Endpoint SIEM Events and Inventory Add-on
supported_themes = light,dark

[package]
id = TA-absolute-secure-endpoint
check_for_updates = true

[id]
name = TA-absolute-secure-endpoint
version = 1.0.2
