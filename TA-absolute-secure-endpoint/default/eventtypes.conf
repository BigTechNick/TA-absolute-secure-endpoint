# Every Absolute SIEM event
[absolute_event]
search = sourcetype="absolute:events"

# Console sign-ins (CIM Authentication)
[absolute_authentication]
search = sourcetype="absolute:events" eventType IN ("UserLogin", "UserLoginFailed")

# Console sign-outs and session time-outs (not CIM-mapped: Authentication covers sign-ins only)
[absolute_session]
search = sourcetype="absolute:events" eventType IN ("UserLogout", "SessionTimeout")

# Console accounts created, changed or reset (CIM Change: Account_Management)
[absolute_account_change]
search = sourcetype="absolute:events" objectObjectType="User"

# Console settings: roles, rules, geofences, policy groups, approvals (CIM Change)
[absolute_console_change]
search = sourcetype="absolute:events" actorObjectType="User" NOT objectObjectType IN ("Device", "User", "IdentityProvider") NOT verb="Accessed" NOT eventType IN ("UserLogin", "UserLoginFailed", "UserLogout", "SessionTimeout")

# Changes on devices: reported by the agent (applications, hardware, network,
# OS, encryption, antivirus, location, compliance) or made to them (freeze,
# disable, unenroll, license, policy group) (CIM Change: Endpoint_Changes)
[absolute_endpoint_change]
search = sourcetype="absolute:events" (actorObjectType="Device" OR objectObjectType="Device") NOT eventType IN ("AlertTriggered", "DeviceConnectionBlocked") NOT verb="Accessed"

# Alert rules that fired, and connections blocked in restricted regions (CIM Alerts)
[absolute_alert]
search = sourcetype="absolute:events" eventType IN ("AlertTriggered", "DeviceConnectionBlocked")

# Console users viewing device location history or the map (CIM Data Access)
[absolute_data_access]
search = sourcetype="absolute:events" actorObjectType="User" verb="Accessed"

# Device inventory snapshots (CIM Inventory)
[absolute_device]
search = sourcetype="absolute:devices"
