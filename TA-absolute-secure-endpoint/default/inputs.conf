# Defaults for every input of this add-on. Inputs themselves are created in
# Splunk Web (the add-on's Inputs page, or Settings > Data inputs) and saved
# in this add-on's local/inputs.conf.
[absolute_events]
python.version = python3
python.required = 3.13,3.9
interval = 300
start_hours_ago = 24
delay_minutes = 5
overlap_minutes = 10
page_size = 1000
exclude_event_types =
log_level = INFO

[absolute_devices]
python.version = python3
python.required = 3.13,3.9
interval = 86400
connected_within_hours = 24
page_size = 100
exclude_fields =
log_level = INFO
