# ---------------------------------------------------------------- SIEM events
# One JSON object per event, written by the absolute_events modular input on the
# forwarder (index-time settings apply there); search-time settings below.
# _time = when the event happened on the device or in the console (eventDateTimeUtc).
# Events from devices that were offline arrive late: _indextime - _time can be days.
[absolute:events]
category = Security
description = Absolute Secure Endpoint SIEM events from the Absolute API (TA-absolute-secure-endpoint)
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 200000
TIME_PREFIX = "eventDateTimeUtc":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N
MAX_TIMESTAMP_LOOKAHEAD = 23
MAX_DAYS_AGO = 3650
TZ = UTC
KV_MODE = json
# objectProperties also comes split up as properties.<name>.old / properties.<name>.new
REPORT-absolute_object_attrs = absolute_object_attrs
EVAL-vendor = "Absolute"
EVAL-product = "Secure Endpoint"
EVAL-vendor_product = "Absolute Secure Endpoint"
EVAL-dvc = host
EVAL-app = case(actorObjectType=="User", "absolute:console", actorObjectType=="Device", "absolute:agent", true(), "absolute")
# dest: the device the event is about; otherwise the Absolute account (host)
EVAL-dest = case(verb=="Accessed", host, objectObjectType=="Device", coalesce(nullif(objectDisplayName, ""), objectDisplayId), actorObjectType=="Device", coalesce(nullif(actorDisplayName, ""), actorDisplayId), secondaryObjectType=="Device", coalesce(nullif(secondaryObjectDisplayName, ""), secondaryObjectDisplayId), true(), host)
# user: the console user who acted; for account changes, the account changed (src_user = who changed it)
EVAL-user = case(objectObjectType=="User", objectDisplayName, actorObjectType=="User", actorDisplayName)
EVAL-src_user = if(actorObjectType=="User", actorDisplayName, null())
EVAL-src = if(actorObjectType=="User", 'properties.IpAddress.new', null())
EVAL-user_agent = 'properties.BrowserAgent.new'
EVAL-action = case(eventType=="UserLogin", "success", eventType=="UserLoginFailed" OR (objectObjectType=="IdentityProvider" AND verb=="Failed"), "failure", verb=="Accessed", "read", verb=="Triggered", null(), verb=="Blocked", "blocked", in(verb, "LoggedOut", "Timeout"), "logoff", in(verb, "Installed", "Added", "Created", "Enrolled"), "created", in(verb, "Uninstalled", "Removed", "Deleted", "Unenrolled") OR eventType=="DeviceUnenrollFailed", "deleted", eventType=="DeviceDisabled", "stopped", true(), "modified")
EVAL-status = if(verb=="Failed" OR like(eventType, "%Failed"), "failure", "success")
EVAL-result = verb
EVAL-object = case(objectObjectType=="Device" AND in(secondaryObjectType, "Volume", "Disk", "NetworkAdapter", "PolicyGroup"), coalesce(nullif(secondaryObjectDisplayName, ""), secondaryObjectDisplayId), true(), coalesce(nullif(objectDisplayName, ""), objectDisplayId))
EVAL-object_id = case(objectObjectType=="Device" AND in(secondaryObjectType, "Volume", "Disk", "NetworkAdapter", "PolicyGroup"), secondaryObjectDisplayId, true(), objectDisplayId)
EVAL-object_category = lower(case(objectObjectType=="Device" AND in(secondaryObjectType, "Volume", "Disk", "NetworkAdapter", "PolicyGroup"), secondaryObjectType, isnotnull(objectObjectType) AND objectObjectType!="", objectObjectType, true(), "unknown"))
EVAL-change_type = case(match(eventType, "^(Rule|PolicyGroup|Geofence|Report)(Created|Updated|Deleted)"), "configuration", objectObjectType=="User" OR match(eventType, "^(Role|DualApproval|TwoFactor)"), "AAA", match(eventType, "^(NewApplicationDetected|Application)"), "application", match(eventType, "^AP"), "application_persistence", match(eventType, "(Location|Geofence)"), "geolocation", match(eventType, "(?i)encrypt"), "encryption", match(eventType, "AV(Product|Protected|Unprotected)"), "antivirus", match(eventType, "^Agent"), "agent", match(eventType, "(Disk|Volume|Memory|NetworkAdapter)"), "hardware", match(eventType, "^Device(SystemInformation|OperatingSystem|UserInformation|CDCValue)"), "inventory", match(eventType, "^Device"), "device_management", true(), "other")
# Alerts
EVAL-type = if(in(eventType, "AlertTriggered", "DeviceConnectionBlocked"), "alert", null())
EVAL-severity = if(in(eventType, "AlertTriggered", "DeviceConnectionBlocked"), "medium", null())
EVAL-signature = case(eventType=="AlertTriggered", actorDisplayName, eventType=="DeviceConnectionBlocked", "Device connection blocked: " . coalesce('properties.Reason.new', "restricted region"), true(), eventType)
EVAL-signature_id = if(eventType=="AlertTriggered", actorDisplayId, eventType)
EVAL-description = case(eventType=="AlertTriggered", "Absolute alert rule \"" . coalesce(actorDisplayName, actorDisplayId, "?") . "\" triggered by " . coalesce(objectDisplayName, "an event") . " on " . coalesce(nullif(secondaryObjectDisplayName, ""), secondaryObjectDisplayId, "a device"), eventType=="DeviceConnectionBlocked", "Absolute blocked the connection of " . coalesce(objectDisplayName, "a device") . ": " . coalesce('properties.Reason.new', "restricted region") . " (" . coalesce('properties.RestrictedRegion.new', secondaryObjectDisplayName, "") . ")")

# ---------------------------------------------------------------- devices
# One JSON object per device per run (a snapshot), written by the absolute_devices
# modular input. _time = the run's start time. Splunk's automatic JSON extraction
# stops after 100 fields and 10240 characters by default (limits.conf [kv] limit and
# maxchars on the search heads), and device records are longer: the CIM fields below
# are read with spath(), which reads the whole event.
[absolute:devices]
category = Security
description = Absolute Secure Endpoint device inventory from the Absolute API (TA-absolute-secure-endpoint)
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 2000000
DATETIME_CONFIG = CURRENT
KV_MODE = json
EVAL-vendor = "Absolute"
EVAL-product = "Secure Endpoint"
EVAL-dvc = host
EVAL-dest = coalesce(spath(_raw, "deviceName"), spath(_raw, "fullSystemName"), spath(_raw, "serialNumber"), spath(_raw, "deviceUid"))
EVAL-dest_nt_host = spath(_raw, "deviceName")
EVAL-dest_dns = spath(_raw, "fullSystemName")
EVAL-serial = spath(_raw, "serialNumber")
EVAL-vendor_product = if(isnotnull(spath(_raw, "systemManufacturer")) AND upper(spath(_raw, "systemManufacturer"))!="UNKNOWN", trim(spath(_raw, "systemManufacturer") . " " . if(isnull(spath(_raw, "systemModel")) OR upper(spath(_raw, "systemModel"))=="UNKNOWN", "", spath(_raw, "systemModel"))), null())
EVAL-os = spath(_raw, "operatingSystem.name")
EVAL-version = coalesce(spath(_raw, "operatingSystem.version"), spath(_raw, "operatingSystem.currentBuild"), spath(_raw, "operatingSystem.build"))
EVAL-family = case(spath(_raw, "cpu.architecture")=="9", "x64", spath(_raw, "cpu.architecture")=="0", "x86", spath(_raw, "cpu.architecture")=="5", "ARM", spath(_raw, "cpu.architecture")=="12", "ARM64", spath(_raw, "cpu.architecture")=="6", "ia64", true(), spath(_raw, "cpu.architecture"))
EVAL-cpu_count = if(isnotnull(spath(_raw, "cpu.id")) OR isnotnull(spath(_raw, "cpu.name")), 1, null())
EVAL-cpu_cores = coalesce(spath(_raw, "cpu.physicalCores"), spath(_raw, "cpu.logicalCores"))
EVAL-cpu_mhz = spath(_raw, "cpu.processorSpeed")
# Older agents report memory in MB in totalPhysicalRamBytes
EVAL-mem = case(isnull(spath(_raw, "totalPhysicalRamBytes")), null(), tonumber(spath(_raw, "totalPhysicalRamBytes"))>=1048576, round(tonumber(spath(_raw, "totalPhysicalRamBytes"))/1048576), true(), tonumber(spath(_raw, "totalPhysicalRamBytes")))
EVAL-ip = mvdedup(mvappend(spath(_raw, "localIp"), spath(_raw, "networkAdapters{}.ipV4Address")))
# absolute_mac: every macAddress as aa:bb:cc:dd:ee:ff, from transforms.conf (Absolute sends 0xAABBCCDDEEFF or AA:BB:...)
EVAL-mac = mvdedup(mvmap(absolute_mac, lower(absolute_mac)))
EVAL-interface = spath(_raw, "networkAdapters{}.name")
EVAL-mount = spath(_raw, "volumes{}.driveLetter")
EVAL-status = case(spath(_raw, "agentStatus")=="A", "active", spath(_raw, "agentStatus")=="I", "inactive", spath(_raw, "agentStatus")=="D", "disabled", true(), spath(_raw, "agentStatus"))
EVAL-enabled = if(spath(_raw, "agentStatus")=="A", "true", "false")
EVAL-user = coalesce(spath(_raw, "currentUsername"), spath(_raw, "username"))
EVAL-description = spath(_raw, "policyGroupName")
REPORT-absolute_mac = absolute_mac

# ---------------------------------------------------------------- collector logs
# $SPLUNK_HOME/var/log/splunk/absolute_se_<events|devices>_<input>.log -> index _internal
[source::.../var/log/splunk/absolute_se_*.log*]
priority = 10
sourcetype = absolute:ta:log

# $SPLUNK_HOME/var/log/splunk/absolute_se-webapi.log (Inputs page actions)
[source::.../var/log/splunk/absolute_se-webapi.log*]
priority = 10
sourcetype = absolute:ta:webapi

[absolute:ta:log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} )
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 23
TRUNCATE = 20000
EXTRACT-absolute_input = absolute_se_(?<input_kind>events|devices)_(?<input>[^\\/]+?)\.log(?:\.\d+)?$ in source
EXTRACT-absolute_line = ^\S+ \S+ (?<log_level>DEBUG|INFO|WARNING|ERROR|CRITICAL) (?<message>.*)
EXTRACT-absolute_run = run (?<run_result>done|failed|skipped|stopped):
EXTRACT-absolute_events_run = written (?<written>\d+), duplicates (?<duplicates>\d+), excluded (?<excluded>\d+), api calls (?<api_calls>\d+), window (?<window_start>[^\s,]+) to (?<window_end>[^\s,]+)
EXTRACT-absolute_devices_run = run done: devices (?<devices>\d+), pages (?<pages>\d+), api calls (?<api_calls>\d+), (?<megabytes>[\d.]+) MB
EXTRACT-absolute_behind = behind (?<behind_min>-?[\d.]+) min
EXTRACT-absolute_duration = run done: .*, (?<duration_sec>[\d.]+) s$

[absolute:ta:webapi]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} )
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 23
EXTRACT-absolute_webapi = ^\S+ \S+ (?<log_level>[A-Z]+) (?<message>.*)
