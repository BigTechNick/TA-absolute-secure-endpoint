# REST API used by the add-on's Inputs page (bin/absolute_se_rest.py)
[script:absolute_se_inputs]
match = /absolute_se/inputs
script = absolute_se_rest.py
scripttype = persist
handler = absolute_se_rest.Handler
requireAuthentication = true
output_modes = json
passPayload = true
passSession = true
passHttpHeaders = false
passHttpCookies = false
python.version = python3
python.required = 3.13,3.9

[script:absolute_se_accounts]
match = /absolute_se/accounts
script = absolute_se_rest.py
scripttype = persist
handler = absolute_se_rest.Handler
requireAuthentication = true
output_modes = json
passPayload = true
passSession = true
passHttpHeaders = false
passHttpCookies = false
python.version = python3
python.required = 3.13,3.9
