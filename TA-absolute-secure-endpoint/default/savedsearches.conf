# Asset list for Splunk Enterprise Security from the Absolute device inventory.
# Enable it, then add the lookup "absolute_assets" in Enterprise Security >
# Configure > Data Enrichment > Asset and Identity Management.
[Absolute - Asset lookup]
description = Builds the absolute_assets lookup (Enterprise Security asset format) from the latest Absolute device inventory.
disabled = 1
enableSched = 1
cron_schedule = 35 3 * * *
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
is_visible = true
search = `absolute_index` sourcetype="absolute:devices" \
| dedup deviceUid \
| where status!="disabled" \
| eval nt_host=dest_nt_host, dns=dest_dns, owner=user, priority="medium" \
| eval lat=coalesce(spath(_raw, "geoData.location.point.y"), mvindex(spath(_raw, "geoData.location.point.coordinates{}"), 1)), long=coalesce(spath(_raw, "geoData.location.point.x"), mvindex(spath(_raw, "geoData.location.point.coordinates{}"), 0)) \
| eval city=spath(_raw, "geoData.location.geoAddress.city"), country=coalesce(spath(_raw, "geoData.location.geoAddress.country"), spath(_raw, "geoData.location.geoAddress.countryCode")) \
| eval chassis=spath(_raw, "chassisType"), platform=spath(_raw, "platformOSType") \
| eval form=case(in(chassis, "8", "9", "10", "14", "31", "32"), "laptop", in(chassis, "3", "4", "5", "6", "7", "13", "15", "16", "35", "36"), "desktop", chassis=="30", "tablet", in(chassis, "17", "23", "28"), "server") \
| eval category=mvjoin(mvappend("absolute_managed", lower(platform), form), "|"), bunit="", pci_domain="", is_expected="false", should_timesync="false", should_update="true", requires_av="true" \
| eval ip=mvjoin(ip, "|"), mac=mvjoin(mac, "|") \
| table ip mac nt_host dns owner priority lat long city country bunit category pci_domain is_expected should_timesync should_update requires_av \
| outputlookup absolute_assets
