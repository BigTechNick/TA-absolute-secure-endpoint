# Names of the properties an event changed (objectProperties), as the CIM field object_attrs.
[absolute_object_attrs]
REGEX = PropertyName(?:\[\d+\])?=([^;"\\]+);
FORMAT = object_attrs::$1
MV_ADD = true

# Device MAC addresses (0xAABBCCDDEEFF or AA:BB:CC:DD:EE:FF) as AA:BB:CC:DD:EE:FF;
# props.conf lowercases them into the CIM field mac.
[absolute_mac]
REGEX = "macAddress":"(?:0x)?([0-9A-Fa-f]{2})[:\-]?([0-9A-Fa-f]{2})[:\-]?([0-9A-Fa-f]{2})[:\-]?([0-9A-Fa-f]{2})[:\-]?([0-9A-Fa-f]{2})[:\-]?([0-9A-Fa-f]{2})"
FORMAT = absolute_mac::$1:$2:$3:$4:$5:$6
MV_ADD = true

# Asset list for Splunk Enterprise Security, built by the saved search
# "Absolute - Asset lookup" (disabled by default) from the device inventory.
[absolute_assets]
filename = absolute_assets.csv
case_sensitive_match = false
